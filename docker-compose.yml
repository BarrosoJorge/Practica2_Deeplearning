services:
  mlflow:
    container_name: p2dl-mlflow
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow:5000,p2dl-mlflow:5000,host.docker.internal:5000"
    ports:
      - "5000:5000"
    volumes:
      - /home/laviria/mlflow-P2_DL:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  train:
    container_name: p2dl-train
    image: p2dl-train:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      UV_PROJECT_ENVIRONMENT: /env
    gpus: all
    volumes:
      - .:/app
    working_dir: /app
    command: ["/env/bin/python", "scripts/train.py", "--config", "configs/train.yaml"]
    profiles: ["dev"]

  api:
    container_name: p2dl-api
    image: p2dl-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      UV_PROJECT_ENVIRONMENT: /env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: ["/env/bin/uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["inference"]
