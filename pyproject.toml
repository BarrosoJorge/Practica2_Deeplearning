[project]
name = "p2-dl"
version = "0.1.0"
description = "Forecasting de series temporales (RNN vs LSTM) + pipeline MLOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.1.*",
    "pandas==2.2.*",
    "pyyaml>=6.0",
    "scikit-learn==1.6.*",
    "matplotlib>=3.9",
    "dvc>=3.55",
    "mlflow>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.black]
line-length = 96
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
