data:
  dir: data/processed
  window: 24

model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.0

train:
  batch_size: 64
  epochs: 30
  lr: 0.001
  weight_decay: 0.0
  seed: 42
  quick:
    epochs: 2
    max_train_samples: 2000

early_stopping:
  patience: 5
  min_delta: 0.0001

mlflow:
  tracking_uri: http://localhost:5000
  experiment: P2_DL
  run_prefix: fase3
  registry_name: p2dl-forecasting

archs: [rnn, lstm]
